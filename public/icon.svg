<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="diceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="diceLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="diceRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="190" fill="#FFFFFF" opacity="0.1" />

  <!-- Central Game Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Behind: Floating Game Card -->
    <rect x="270" y="110" width="130" height="180" rx="16" transform="rotate(18 335 200)" fill="#FFFFFF" opacity="0.9" stroke="#FDE68A" stroke-width="4" />
    <circle cx="340" cy="180" r="22" fill="#E11D48" opacity="0.8" />

    <!-- Isometric Tabletop Dice -->
    <!-- Top Face -->
    <polygon points="256,150 356,208 256,266 156,208" fill="url(#diceTop)" />
    <!-- Pip on Top Face -->
    <ellipse cx="256" cy="208" rx="14" ry="8" fill="#E11D48" />

    <!-- Left Face -->
    <polygon points="156,208 256,266 256,382 156,324" fill="url(#diceLeft)" />
    <!-- Pips on Left Face -->
    <ellipse cx="190" cy="250" rx="9" ry="12" fill="#78350F" opacity="0.85" />
    <ellipse cx="222" cy="340" rx="9" ry="12" fill="#78350F" opacity="0.85" />

    <!-- Right Face -->
    <polygon points="256,266 356,208 356,324 256,382" fill="url(#diceRight)" />
    <!-- Pips on Right Face -->
    <ellipse cx="290" cy="324" rx="9" ry="12" fill="#451A03" opacity="0.85" />
    <ellipse cx="306" cy="295" rx="9" ry="12" fill="#451A03" opacity="0.85" />
    <ellipse cx="322" cy="266" rx="9" ry="12" fill="#451A03" opacity="0.85" />
  </g>

  <!-- Sparkles -->
  <polygon points="120,130 126,144 140,150 126,156 120,170 114,156 100,150 114,144" fill="#FEF08A" />
  <polygon points="390,380 395,391 406,396 395,401 390,412 385,401 374,396 385,391" fill="#FEF08A" />
</svg>
